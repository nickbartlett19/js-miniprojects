<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2048</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" media="screen" href="https://fontlibrary.org//face/clear-sans" type="text/css"/>

    <script src="js/script.js" defer></script>
</head>

<body class="flex-center flex-column">

    <div class="intro-text flex-column flex-center">
        <h1>2048</h1>
        <p>A 2048 clone made by Nick Bartlett in August 2026. Made for educational purposes with all credit due to the original developers.</p>
    </div>

    <!-- score board -->
    <div class="score-board flex-row">
        <div class="game-score flex-center">Score: 4</div>
        <div class="high-score flex-center">High Score: 4096</div>
    </div>
    
    <!-- game board -->
    <div class="game-board">

        <div class="game-board-row flex-row">
            <div class="game-board-tile flex-center"><span class="tile-value"></span></div>
            <div class="game-board-tile flex-center"><span class="tile-value">32</span></div>
            <div class="game-board-tile flex-center"><span class="tile-value">16</span></div>
            <div class="game-board-tile flex-center"><span class="tile-value"></span></div>
        </div>
        <div class="game-board-row flex-row">
            <div class="game-board-tile flex-center"><span class="tile-value"></span></div>
            <div class="game-board-tile flex-center"><span class="tile-value">2</span></div>
            <div class="game-board-tile flex-center"><span class="tile-value"></span></div>
            <div class="game-board-tile flex-center"><span class="tile-value">4</span></div>
        </div>
        <div class="game-board-row flex-row">
            <div class="game-board-tile flex-center"><span class="tile-value">64</span></div>
            <div class="game-board-tile flex-center"><span class="tile-value">2048</span></div>
            <div class="game-board-tile flex-center"><span class="tile-value">2</span></div>
            <div class="game-board-tile flex-center"><span class="tile-value">8</span></div>
        </div>
        <div class="game-board-row flex-row">
            <div class="game-board-tile flex-center"><span class="tile-value"></span></div>
            <div class="game-board-tile flex-center"><span class="tile-value"></span></div>
            <div class="game-board-tile flex-center"><span class="tile-value">128</span></div>
            <div class="game-board-tile flex-center"><span class="tile-value">256</span></div>
        </div>

    </div>

    <button id="clearButton">Clear</button>

    <button id="populateButton">Populate Board</button>

</body>
</html>
