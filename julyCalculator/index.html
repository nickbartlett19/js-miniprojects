<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>July Calculator</title>

    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/x-icon" href="favicon.png">

    <script src="script.js" defer></script>
    
</head>
<body>
    <p>This is a calculator I am making in July 2026 to remember how to use JavaScript. Started on July 18th.</p>

    <div class="calculator">
        <div class="screen">
            <div class="screen-top flex-center"></div>
            <div class="screen-bottom flex-center"></div>
        </div>
        <div class="row flex-row">
            <div class="btn ac">AC</div>
            <div class="btn">DEL</div>
            <div class="btn">÷</div>
        </div>
        <div class="row flex-row">
            <div class="btn">1</div>
            <div class="btn">2</div>
            <div class="btn">3</div>
            <div class="btn">*</div>
        </div>
        <div class="row flex-row">
            <div class="btn">4</div>
            <div class="btn">5</div>
            <div class="btn">6</div>
            <div class="btn">+</div>
        </div>
        <div class="row flex-row">
            <div class="btn">7</div>
            <div class="btn">8</div>
            <div class="btn">9</div>
            <div class="btn">-</div>
        </div>
        <div class="row flex-row">
            <div class="btn">.</div>
            <div class="btn">0</div>
            <div class="btn equals">=</div>
        </div>
    </div>

</body>
</html>
